[project]
name = "powerbank-bot"
version = "0.1.0"
description = "Telegram bot for a virtual bank game"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.7",
    "pillow>=11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "fonttools>=4.63.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3 flag non-ASCII "look-alike" characters. The UI is Arabic and the
# button labels use symbol emoji, so these fire on correct, intentional text.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting generated code just creates churn.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
